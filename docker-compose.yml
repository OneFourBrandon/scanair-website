services:
  scanair-website:
    image: node:22-alpine
    container_name: scanair-website
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "8080:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - scanair-node-modules:/app/node_modules

volumes:
  scanair-node-modules:
